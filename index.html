<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i-ONE Bank 앱 열기</title>
<style>
  :root { --brand: #013c8c; --brand-light: #eaf1fb; --line: #e6e8ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f5f6f8; color: #1a1a1a;
  }

  /* ===== 헤더 (로고는 logo.png 파일을 올리면 표시됩니다) ===== */
  header {
    background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 14px 18px; position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .brand img { height: 30px; width: auto; display: block; }

  /* ===== 본문 ===== */
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 360px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 36px 24px 28px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.04);
  }
  .spinner {
    width: 30px; height: 30px; margin: 0 auto 22px; border: 3px solid var(--brand-light);
    border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; margin: 0 0 8px; letter-spacing: -.3px; }
  p { font-size: 14px; color: #6b7280; margin: 0 0 26px; line-height: 1.55; }
  .btn {
    display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 11px;
    font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer;
  }
  .primary { background: var(--brand); color: #fff; }
  .secondary { background: #fff; color: #374151; border: 1px solid #d7dbe0; }
  .ver { font-size: 11px; color: #c3c7cc; margin-top: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- 공식 로고 파일 logo.png 를 저장소에 올리면 아래 이미지가 표시됩니다. -->
    <img src="logo.png" alt="IBK 기업은행" onerror="this.style.display='none'">
  </div>
</header>

<main>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">i-ONE Bank 앱을 여는 중…</h1>
    <p id="desc">앱이 열리지 않으면 아래 버튼을 눌러주세요.</p>
    <a class="btn primary" id="openBtn" href="#">앱 열기</a>
    <a class="btn secondary" id="storeBtn" href="#">앱 설치하기</a>
    <div class="ver">v6</div>
  </div>
</main>

<script>
(function () {
  // ---- 설정 ----
  var SCHEME = "ionebank";
  var DEFAULT_COMMAND = "dig_cbd_000000_1";
  var ANDROID_PACKAGE = "com.ibk.android.ionebank";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
  var APPSTORE_URL = "https://apps.apple.com/kr/app/id1460543865";
  var FALLBACK_DELAY = 1800;         // ms (iOS)
  var ANDROID_FALLBACK_DELAY = 2500; // ms

  // ?c=xxx 로 command 변경 가능 (영문/숫자/_ 만 허용)
  var q = new URLSearchParams(location.search).get("c");
  var command = (q && /^[A-Za-z0-9_]+$/.test(q)) ? q : DEFAULT_COMMAND;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  var schemeUrl = SCHEME + "://?command=" + command;
  // 버튼 터치용: fallback 포함 → 앱 없으면 크롬이 플레이스토어로 보냄
  var intentUrl = "intent://?command=" + command +
    "#Intent;scheme=" + SCHEME +
    ";S.browser_fallback_url=" + encodeURIComponent(PLAY_URL) +
    ";end";
  // 자동 시도용: fallback 없음 (크롬이 제스처 없는 intent를 막고 fallback으로 보내는 것을 방지)
  var intentUrlNoFallback = "intent://?command=" + command +
    "#Intent;scheme=" + SCHEME + ";end";

  var openBtn = document.getElementById("openBtn");
  var storeBtn = document.getElementById("storeBtn");
  openBtn.href = isAndroid ? intentUrl : schemeUrl;
  storeBtn.href = isIOS ? APPSTORE_URL : PLAY_URL;

  if (!isAndroid && !isIOS) {
    // PC 등: 자동 실행하지 않고 안내만
    document.getElementById("spinner").className = "hidden";
    document.getElementById("title").textContent = "휴대폰에서 열어주세요";
    document.getElementById("desc").textContent = "이 링크는 i-ONE Bank 앱이 설치된 휴대폰에서 동작합니다.";
    openBtn.className = "hidden";
    storeBtn.textContent = "Google Play";
    storeBtn.href = PLAY_URL;
    var ios = storeBtn.cloneNode(true);
    ios.textContent = "App Store"; ios.href = APPSTORE_URL;
    storeBtn.parentNode.insertBefore(ios, storeBtn.nextSibling);
    return;
  }

  // 앱으로 넘어가면 페이지가 숨겨지므로 스토어 이동 취소
  var timer = null;
  function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener("visibilitychange", function () { if (document.hidden) cancel(); });
  window.addEventListener("pagehide", cancel);
  if (isAndroid) window.addEventListener("blur", cancel); // 앱 선택 창이 떠도 스토어로 가지 않게

  function tryOpen(byUser) {
    cancel();
    if (isAndroid) {
      if (byUser) {
        location.href = intentUrl;
      } else {
        timer = setTimeout(function () { location.href = PLAY_URL; }, ANDROID_FALLBACK_DELAY);
        location.href = intentUrlNoFallback;
      }
    } else {
      timer = setTimeout(function () { location.href = APPSTORE_URL; }, FALLBACK_DELAY);
      location.href = schemeUrl;
    }
  }

  if (!isAndroid) {
    openBtn.addEventListener("click", function (e) { e.preventDefault(); tryOpen(true); });
  }
  tryOpen(false);
})();
</script>
</body>
</html>
